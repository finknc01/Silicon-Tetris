# Fictional starter workload deck. Tune/refine these during the lab.
workloads:
  - name: train-orion
    type: training
    priority: high
    minimum_gpus: 4
    target_gpus: 8
    minimum_vram_per_gpu_gb: 48
    estimated_compute_hours_per_week: 60
    network_sensitivity: high
    checkpoint_size_gb: 120
    checkpoint_interval_minutes: 30
    latency_sensitive: false

  - name: finetune-lyra
    type: fine_tuning
    priority: medium
    minimum_gpus: 1
    target_gpus: 2
    minimum_vram_per_gpu_gb: 24
    estimated_compute_hours_per_week: 30
    network_sensitivity: medium
    checkpoint_size_gb: 40
    checkpoint_interval_minutes: 45
    latency_sensitive: false

  - name: batch-infer-cetus
    type: batch_inference
    priority: low
    minimum_gpus: 1
    target_gpus: 2
    minimum_vram_per_gpu_gb: 16
    estimated_compute_hours_per_week: 50
    network_sensitivity: low
    checkpoint_size_gb: 0
    checkpoint_interval_minutes: null
    latency_sensitive: false

  - name: realtime-infer-nova
    type: realtime_inference
    priority: critical
    minimum_gpus: 1
    target_gpus: 2
    minimum_vram_per_gpu_gb: 24
    estimated_compute_hours_per_week: 168
    network_sensitivity: medium
    checkpoint_size_gb: 0
    checkpoint_interval_minutes: null
    latency_sensitive: true
    availability_target_percent: 99.9

# These are scenario inputs, not measured workload requirements. As you learn
# workload characterization, replace guesses with explicit derivations or
# clearly dated evidence where appropriate.
